# Local stdio launch definition. Listing/submission follows npm publication.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      auditPath:
        type: string
        description: Local path for the append-only receipts audit.
  commandFunction: |-
    (config) => ({ command: 'npx', args: ['-y', '@77systems/receipts-mcp@0.2.0'], env: config.auditPath ? { RECEIPTS_AUDIT_PATH: config.auditPath } : {} })
